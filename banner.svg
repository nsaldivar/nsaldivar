<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Nahun Jose Saldivar Zamora - Ingeniería de Sistemas e Informática">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#14213D"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1E3A5F" opacity="0.7"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <circle cx="930" cy="160" r="230" fill="url(#glow)"/>

  <!-- motivo: red de nodos (servicios conectados) -->
  <g stroke="url(#ac)" stroke-width="2" fill="none" opacity="0.85">
    <line x1="930" y1="160" x2="1060" y2="85"/>
    <line x1="930" y1="160" x2="1065" y2="235"/>
    <line x1="930" y1="160" x2="800" y2="95"/>
    <line x1="930" y1="160" x2="805" y2="240"/>
    <line x1="1060" y1="85" x2="1065" y2="235" stroke-dasharray="4 6" opacity="0.6"/>
    <line x1="800" y1="95" x2="805" y2="240" stroke-dasharray="4 6" opacity="0.6"/>
  </g>
  <circle cx="930" cy="160" r="44" fill="#0B1220" stroke="url(#ac)" stroke-width="3"/>
  <circle cx="930" cy="160" r="14" fill="url(#ac)"/>
  <g fill="#0B1220" stroke="#38BDF8" stroke-width="2.5">
    <circle cx="1060" cy="85" r="20"/>
    <circle cx="1065" cy="235" r="20"/>
    <circle cx="800" cy="95" r="20"/>
    <circle cx="805" cy="240" r="20"/>
  </g>
  <g fill="#818CF8">
    <circle cx="1060" cy="85" r="6"/>
    <circle cx="1065" cy="235" r="6"/>
    <circle cx="800" cy="95" r="6"/>
    <circle cx="805" cy="240" r="6"/>
  </g>

  <!-- texto -->
  <text x="70" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#38BDF8" font-weight="600">PORTAFOLIO · GITHUB</text>
  <text x="70" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#F1F5F9">Nahun Jose</text>
  <text x="70" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#F1F5F9">Saldivar Zamora</text>
  <rect x="70" y="238" width="90" height="4" rx="2" fill="url(#ac)"/>
  <text x="70" y="276" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#94A3B8">Ingeniería de Sistemas e Informática  ·  Bases de datos  ·  Software  ·  Cusco, Perú</text>
</svg>
